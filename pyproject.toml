[project]
name = "vibebunny"
version = "0.1.0"
description = "Chat-based coding agent — control a persistent coding project through WhatsApp"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
keywords = ["whatsapp", "coding-agent", "opencode", "ai", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.20",
    "ruff>=0.15.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "fakeredis>=2.21.0",
]
