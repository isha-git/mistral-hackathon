version: '3.8'

# SECURE CONFIGURATION FOR HOME SERVER
# This configuration only exposes the API to localhost (127.0.0.1)
# Use nginx or another reverse proxy if you need external access

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - app-network

  opencode:
    image: ghcr.io/felixclements/opencode-server-docker:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"model":"%s/%s","provider":{"%s":{"models":{"%s":{}}}}}\n' \
          "$$OPENCODE_PROVIDER_ID" "$$OPENCODE_MODEL_ID" \
          "$$OPENCODE_PROVIDER_ID" "$$OPENCODE_MODEL_ID" \
          > /workspace/opencode.json
        exec opencode serve --port 4096 --hostname 0.0.0.0
    environment:
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:-}
      - OPENCODE_CONFIG=/workspace/opencode.json
      - OPENCODE_PROVIDER_ID=${OPENCODE_PROVIDER_ID:-anthropic}
      - OPENCODE_MODEL_ID=${OPENCODE_MODEL_ID:-claude-sonnet-4-20250514}
    env_file:
      - .env
    volumes:
      - ./vibe_repos:/workspace
      - opencode_data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4096/global/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-network

  whatsapp:
    build:
      context: ./src/whatsapp
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3456:3456"
    environment:
      - API_URL=http://api:8000
      - SEND_PORT=3456
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - whatsapp-auth:/app/.auth
    depends_on:
      - api
    networks:
      - app-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - HOST=0.0.0.0
      - PORT=8000
      - WHATSAPP_CALLBACK_URL=http://whatsapp:3456/send
      - OPENCODE_URL=http://opencode:4096
    env_file:
      - .env
    volumes:
      - ./vibe_repos:/app/vibe_repos
    depends_on:
      redis:
        condition: service_healthy
      opencode:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - app-network
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A src.api.config.celery worker --loglevel=info --concurrency=2
    tty: true
    stdin_open: true
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OPENCODE_URL=http://opencode:4096
    env_file:
      - .env
    volumes:
      - ./vibe_repos:/app/vibe_repos
    depends_on:
      redis:
        condition: service_healthy
      opencode:
        condition: service_healthy
    user: "1000:1000"
    networks:
      - app-network
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      disable: true

volumes:
  redis_data:
  whatsapp-auth:
  opencode_data:

networks:
  app-network:
    driver: bridge
    internal: false
